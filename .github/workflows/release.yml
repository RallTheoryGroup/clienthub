name: Release ClientHub
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
permissions:
  contents: read
  id-token: write
env:
  APP: clienthub-rtg-aa
  RG: rg-clienthub-ch11
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: dotnet publish src/ClientHub -o out
          -p:Version=${{ inputs.version }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          slot-name: staging
          package: out
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az webapp traffic-routing clear -g $RG -n $APP
          az webapp deployment slot swap -g $RG -n $APP \
            --slot staging --target-slot production
      - name: Check health and mark the release
        run: |
          curl -fsS --retry 10 --retry-all-errors \
            https://$APP.azurewebsites.net/health
          jq -n --arg v "${{ inputs.version }}" \
            --arg id "$(uuidgen)" '{Id: $id,
            AnnotationName: "ClientHub \($v)",
            Category: "Deployment", EventTime: (now | todate),
            Properties: ({ReleaseName: $v,
              Commit: env.GITHUB_SHA} | tojson)}' > note.json
          U="https://management.azure.com${{ vars.AI_ID }}"
          az rest -m put -b @note.json \
            -u "$U/Annotations?api-version=2015-05-01"
